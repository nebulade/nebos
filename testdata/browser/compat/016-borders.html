<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>016 borders</title>
<style>
html, body { margin: 0; padding: 0; background: #ffffff; color: #202020; }
body { font-family: sans-serif; font-size: 13px; }
h1 { font-size: 20px; margin: 10px 0 4px 10px; }
p { margin: 0 0 10px 10px; }
.pane { float: left; width: 440px; margin-left: 10px; }
.label { background: #eeeeee; padding: 4px 6px; margin-bottom: 4px; }
.stage { background: #ffffff; padding: 8px; border: 1px solid #999999; }
.bare { height: 72px; }
.after { background: #333333; color: #ffffff; height: 24px; margin-top: 8px; padding-left: 4px; }
</style>
</head>
<body>
<h1>016 &middot; per-side borders</h1>
<p>Both boxes must be 212 x 72 px with red on top, green on the right, blue at the bottom and black on the left.</p>
<div class="pane">
<div class="label">A: border widths and colours</div>
<div class="stage">
  <div class="bare">
    <div style="width: 200px; height: 60px; background: #dddddd; border-style: solid; border-width: 10px 4px 2px 8px; border-color: #ff0000 #00ff00 #0000ff #000000"></div>
  </div>
  <div class="after">after</div>
</div>
</div>
<div class="pane">
<div class="label">B: absolute reference strips</div>
<div class="stage">
  <div class="bare" style="position: relative; height: 72px">
    <div style="position: absolute; left: 0; top: 0; width: 212px; height: 10px; background: #ff0000"></div>
    <div style="position: absolute; left: 0; top: 10px; width: 8px; height: 60px; background: #000000"></div>
    <div style="position: absolute; left: 208px; top: 10px; width: 4px; height: 60px; background: #00ff00"></div>
    <div style="position: absolute; left: 0; top: 70px; width: 212px; height: 2px; background: #0000ff"></div>
    <div style="position: absolute; left: 8px; top: 10px; width: 200px; height: 60px; background: #dddddd"></div>
  </div>
  <div class="after">after</div>
</div>
</div>
</body>
</html>
