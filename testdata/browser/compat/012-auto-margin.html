<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>012 auto margin</title>
<style>
html, body { margin: 0; padding: 0; background: #ffffff; color: #202020; }
body { font-family: sans-serif; font-size: 13px; }
h1 { font-size: 20px; margin: 10px 0 4px 10px; }
p { margin: 0 0 10px 10px; }
.pane { float: left; width: 440px; margin-left: 10px; }
.label { background: #eeeeee; padding: 4px 6px; margin-bottom: 4px; }
.stage { background: #ffffff; padding: 8px; border: 1px solid #999999; }
.red { background: #cc3333; height: 40px; }
.after { background: #333333; color: #ffffff; height: 24px; margin-top: 4px; padding-left: 4px; }
</style>
</head>
<body>
<h1>012 &middot; margin: 0 auto</h1>
<p>The red box must be centred in both panes (111 px from the stage's content edge).</p>
<div class="pane">
<div class="label">A: width: 200px; margin: 0 auto</div>
<div class="stage">
  <div class="red" style="width: 200px; margin: 0 auto"></div>
  <div class="after">after</div>
</div>
</div>
<div class="pane">
<div class="label">B: width: 200px; margin-left: 111px</div>
<div class="stage">
  <div class="red" style="width: 200px; margin-left: 111px"></div>
  <div class="after">after</div>
</div>
</div>
</body>
</html>
