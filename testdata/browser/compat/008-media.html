<!doctype html>
<html><head><meta charset="utf-8"><title>008 media queries</title>
<style>
html,body{margin:0;padding:0;background:#fff;color:#202020;font-family:sans-serif;font-size:13px}
h1{font-size:20px;margin:10px 0 4px 10px}p{margin:0 0 10px 10px}
.pane{float:left;width:440px;margin-left:10px}.label{background:#eee;padding:4px 6px;margin-bottom:4px}
.stage{background:#fff;padding:8px;border:1px solid #999}
.box{height:80px;background:#2244cc}
@media (min-width: 800px) { .box { background: #cc3333; } }
</style></head><body>
<h1>008 &middot; @media</h1>
<p>On the normal 960+ px browser canvas the box must be red; below 800 px it is blue.</p>
<div class="pane"><div class="label">A: @media (min-width: 800px)</div><div class="stage"><div class="box"></div></div></div>
<div class="pane"><div class="label">B: no media</div><div class="stage"><div class="box" style="background:#cc3333"></div></div></div>
</body></html>
