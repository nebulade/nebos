<!doctype html>
<html><head><meta charset="utf-8"><title>004 float row</title>
<style>
html,body{margin:0;padding:0;background:#fff;color:#202020;font-family:sans-serif;font-size:13px}
h1{font-size:20px;margin:10px 0 4px 10px}p{margin:0 0 10px 10px}
.pane{float:left;width:440px;margin-left:10px}.label{background:#eee;padding:4px 6px;margin-bottom:4px}
.stage{background:#fff;padding:8px;border:1px solid #999}
.red{background:#cc3333}.green{background:#22aa44}.after{background:#333;color:#fff;height:24px;margin-top:8px;padding-left:4px}
</style></head><body>
<h1>004 &middot; float row</h1>
<p>Two 150 px columns side by side, with the bar below.</p>
<div class="pane"><div class="label">A: floats</div><div class="stage">
<div class="red" style="float:left;width:150px;height:50px"></div>
<div class="green" style="float:right;width:150px;height:50px"></div>
<div class="after">after</div>
</div></div>
<div class="pane"><div class="label">B: table</div><div class="stage">
<table style="width:100%"><tr><td style="width:50%" class="red" height="50"></td><td style="width:50%" class="green" height="50"></td></tr></table>
<div class="after">after</div>
</div></div>
</body></html>
