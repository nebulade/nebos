<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>024 nested em</title>
<style>
html, body { margin: 0; padding: 0; background: #ffffff; color: #202020; }
body { font-family: sans-serif; font-size: 13px; }
h1 { font-size: 20px; margin: 10px 0 4px 10px; }
p { margin: 0 0 10px 10px; }
.pane { float: left; width: 440px; margin-left: 10px; }
.label { background: #eeeeee; padding: 4px 6px; margin-bottom: 4px; }
.stage { background: #ffffff; padding: 8px; border: 1px solid #999999; }
.outer { font-size: 20px; }
.inner { font-size: 1.5em; width: 10em; height: 30px; background: #cc3333; color: #ffffff; }
.after { background: #333333; color: #ffffff; height: 24px; margin-top: 8px; padding-left: 4px; }
</style>
</head>
<body>
<h1>024 &middot; nested em</h1>
<p>The red box must be 300 x 30 px with 30 px text in both panes.</p>
<div class="pane">
<div class="label">A: font-size: 1.5em; width: 10em</div>
<div class="stage">
  <div class="outer">
    <div class="inner">Aa</div>
  </div>
  <div class="after">after</div>
</div>
</div>
<div class="pane">
<div class="label">B: width: 300px; font-size: 30px</div>
<div class="stage">
  <div class="inner" style="font-size: 30px; width: 300px">Aa</div>
  <div class="after">after</div>
</div>
</div>
</body>
</html>
