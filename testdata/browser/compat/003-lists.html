<!doctype html>
<html><head><meta charset="utf-8"><title>003 lists</title>
<style>
html,body{margin:0;padding:0;background:#fff;color:#202020;font-family:sans-serif;font-size:13px}
h1{font-size:20px;margin:10px 0 4px 10px}p{margin:0 0 10px 10px}
.pane{float:left;width:440px;margin-left:10px}.label{background:#eee;padding:4px 6px;margin-bottom:4px}
.stage{background:#fff;padding:8px;border:1px solid #999}
</style></head><body>
<h1>003 &middot; lists</h1>
<p>Both panes must show a bulleted list and a numbered list.</p>
<div class="pane"><div class="label">A: nested</div><div class="stage">
<ul><li>one</li><li>two<ul><li>two a</li><li>two b</li></ul></li></ul>
<ol><li>first</li><li>second</li><li>third</li></ol>
</div></div>
<div class="pane"><div class="label">B: flat</div><div class="stage">
<ul><li>one</li><li>two</li></ul>
<ol><li>first</li><li>second</li><li>third</li></ol>
</div></div>
</body></html>
