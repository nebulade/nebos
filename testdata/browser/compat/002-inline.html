<!doctype html>
<html><head><meta charset="utf-8"><title>002 inline</title>
<style>
html,body{margin:0;padding:0;background:#fff;color:#202020;font-family:sans-serif;font-size:13px}
h1{font-size:20px;margin:10px 0 4px 10px}p{margin:0 0 10px 10px}
.pane{float:left;width:440px;margin-left:10px}.label{background:#eee;padding:4px 6px;margin-bottom:4px}
.stage{background:#fff;padding:8px;border:1px solid #999}
</style></head><body>
<h1>002 &middot; inline formatting</h1>
<p>The two lines must look identical.</p>
<div class="pane"><div class="label">A: b / i / u</div><div class="stage">
Normal <b>bold</b> <i>italic</i> <u>underlined</u> and <b><i>both</i></b>.
</div></div>
<div class="pane"><div class="label">B: inline styles</div><div class="stage">
Normal <span style="font-weight:bold">bold</span> <span style="font-style:italic">italic</span> <span style="text-decoration:underline">underlined</span> and <span style="font-weight:bold;font-style:italic">both</span>.
</div></div>
</body></html>
