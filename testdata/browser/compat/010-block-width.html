<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>010 block width</title>
<style>
html, body { margin: 0; padding: 0; background: #ffffff; color: #202020; }
body { font-family: sans-serif; font-size: 13px; }
h1 { font-size: 20px; margin: 10px 0 4px 10px; }
p { margin: 0 0 10px 10px; }
.pane { float: left; width: 440px; margin-left: 10px; }
.label { background: #eeeeee; padding: 4px 6px; margin-bottom: 4px; }
.stage { background: #ffffff; padding: 8px; border: 1px solid #999999; }
.red { background: #cc3333; height: 34px; }
.after { background: #333333; color: #ffffff; height: 24px; margin-top: 4px; padding-left: 4px; }
.row { margin-bottom: 8px; }
</style>
</head>
<body>
<h1>010 &middot; block width</h1>
<p>Each red box must be the same width in both panes. A is a normal block; B is a float with the same explicit width.</p>
<div class="pane">
<div class="label">A: width on normal blocks</div>
<div class="stage">
  <div class="row"><div class="red" style="width: 200px"></div></div>
  <div class="row"><div class="red" style="width: 50%"></div></div>
  <div class="row"><div class="red" style="width: 400px; max-width: 200px"></div></div>
  <div class="row"><div class="red" style="width: 100px; min-width: 300px"></div></div>
  <div class="after">after</div>
</div>
</div>
<div class="pane">
<div class="label">B: floated reference</div>
<div class="stage">
  <div class="row"><div class="red" style="float: left; width: 200px"></div></div>
  <div class="row"><div class="red" style="float: left; width: 211px"></div></div>
  <div class="row"><div class="red" style="float: left; width: 200px"></div></div>
  <div class="row"><div class="red" style="float: left; width: 300px"></div></div>
  <div class="after">after</div>
</div>
</div>
</body>
</html>
