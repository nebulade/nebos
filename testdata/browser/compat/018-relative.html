<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>018 relative</title>
<style>
html, body { margin: 0; padding: 0; background: #ffffff; color: #202020; }
body { font-family: sans-serif; font-size: 13px; }
h1 { font-size: 20px; margin: 10px 0 4px 10px; }
p { margin: 0 0 10px 10px; }
.pane { float: left; width: 440px; margin-left: 10px; }
.label { background: #eeeeee; padding: 4px 6px; margin-bottom: 4px; }
.stage { background: #ffffff; padding: 8px; border: 1px solid #999999; }
.red { width: 120px; height: 30px; background: #cc3333; }
.after { background: #333333; color: #ffffff; height: 24px; padding-left: 4px; }
</style>
</head>
<body>
<h1>018 &middot; position: relative</h1>
<p>The red box and the following bar must be in the same place in both panes.</p>
<div class="pane">
<div class="label">A: relative left/top</div>
<div class="stage">
  <div class="red" style="position: relative; left: 40px; top: 20px"></div>
  <div class="after">after</div>
</div>
</div>
<div class="pane">
<div class="label">B: margins</div>
<div class="stage">
  <div class="red" style="margin-left: 40px; margin-top: 20px; margin-bottom: -20px"></div>
  <div class="after">after</div>
</div>
</div>
</body>
</html>
