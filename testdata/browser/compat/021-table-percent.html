<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>021 table percentage columns</title>
<style>
html, body { margin: 0; padding: 0; background: #ffffff; color: #202020; }
body { font-family: sans-serif; font-size: 13px; }
h1 { font-size: 20px; margin: 10px 0 4px 10px; }
p { margin: 0 0 10px 10px; }
.pane { float: left; width: 440px; margin-left: 10px; }
.label { background: #eeeeee; padding: 4px 6px; margin-bottom: 4px; }
.stage { background: #ffffff; padding: 8px; border: 1px solid #999999; }
td { height: 24px; color: #ffffff; }
.red { background: #cc3333; }
.blue { background: #2244cc; }
.after { background: #333333; color: #ffffff; height: 24px; margin-top: 8px; padding-left: 4px; }
</style>
</head>
<body>
<h1>021 &middot; table percentage columns</h1>
<p>The red cell must be 30% and the blue cell 70% of the table in both panes.</p>
<div class="pane">
<div class="label">A: 30% / 70%</div>
<div class="stage">
  <table style="width: 422px">
    <tr><td class="red" style="width: 30%">30%</td><td class="blue" style="width: 70%">70%</td></tr>
  </table>
  <div class="after">after</div>
</div>
</div>
<div class="pane">
<div class="label">B: 126px / 296px reference</div>
<div class="stage">
  <table style="width: 422px">
    <tr><td class="red" style="width: 126px">30%</td><td class="blue" style="width: 296px">70%</td></tr>
  </table>
  <div class="after">after</div>
</div>
</div>
</body>
</html>
