<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>019 right and bottom</title>
<style>
html, body { margin: 0; padding: 0; background: #ffffff; color: #202020; }
body { font-family: sans-serif; font-size: 13px; }
h1 { font-size: 20px; margin: 10px 0 4px 10px; }
p { margin: 0 0 10px 10px; }
.pane { float: left; width: 440px; margin-left: 10px; }
.label { background: #eeeeee; padding: 4px 6px; margin-bottom: 4px; }
.stage { background: #ffffff; padding: 8px; border: 1px solid #999999; }
.cover { background: #eeeeee; width: 300px; height: 160px; }
.box { position: absolute; width: 60px; height: 40px; background: #cc3333; }
.after { background: #333333; color: #ffffff; height: 24px; margin-top: 8px; padding-left: 4px; }
</style>
</head>
<body>
<h1>019 &middot; right and bottom</h1>
<p>The red box must sit at the same bottom-right position in both panes.</p>
<div class="pane">
<div class="label">A: right: 20px; bottom: 10px</div>
<div class="stage">
  <div class="cover">
    <div class="box" style="right: 20px; bottom: 10px"></div>
  </div>
  <div class="after">after</div>
</div>
</div>
<div class="pane">
<div class="label">B: left: 220px; top: 110px</div>
<div class="stage">
  <div class="cover">
    <div class="box" style="left: 220px; top: 110px"></div>
  </div>
  <div class="after">after</div>
</div>
</div>
</body>
</html>
