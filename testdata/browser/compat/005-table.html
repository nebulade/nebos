<!doctype html>
<html><head><meta charset="utf-8"><title>005 table</title>
<style>
html,body{margin:0;padding:0;background:#fff;color:#202020;font-family:sans-serif;font-size:13px}
h1{font-size:20px;margin:10px 0 4px 10px}p{margin:0 0 10px 10px}
.pane{float:left;width:440px;margin-left:10px}.label{background:#eee;padding:4px 6px;margin-bottom:4px}
.stage{background:#fff;padding:8px;border:1px solid #999}
td{padding:6px;border:1px solid #999}.head{background:#eee;font-weight:bold}
</style></head><body>
<h1>005 &middot; table</h1>
<p>Both panes must show the same 3 x 2 table.</p>
<div class="pane"><div class="label">A: table</div><div class="stage">
<table style="width:360px"><tr class="head"><td>Name</td><td>Value</td><td>Note</td></tr>
<tr><td>alpha</td><td>1</td><td>first</td></tr><tr><td>beta</td><td>2</td><td>second</td></tr></table>
</div></div>
<div class="pane"><div class="label">B: table reference</div><div class="stage">
<table style="width:360px"><tr class="head"><td>Name</td><td>Value</td><td>Note</td></tr>
<tr><td>alpha</td><td>1</td><td>first</td></tr><tr><td>beta</td><td>2</td><td>second</td></tr></table>
</div></div>
</body></html>
